name: Release Build

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.1.0)'
        required: true
        default: 'v1.1.0'

permissions:
  contents: write

jobs:
  build-core:
    name: Build Core ZIP
    runs-on: ubuntu-latest
    outputs:
      font_count: ${{ steps.count.outputs.total }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "version=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Count source fonts
        id: count
        run: |
          TOTAL=$(find assets/fonts -maxdepth 1 -type f \( -name "*.ttf" -o -name "*.otf" \) 2>/dev/null | wc -l)
          echo "total=${TOTAL}" >> $GITHUB_OUTPUT
          echo "저장소 폰트 총 개수: ${TOTAL}"

      - name: Validate core font presence
        run: |
          REQUIRED=(
            "NotoSansKR-VF.ttf"
            "NanumMyeongjo-OldHangul.ttf"
            "NanumBrushScript-Regular.ttf"
            "NanumPenScript-Regular.ttf"
            "JejuGothic-Regular.ttf"
          )
          MISSING=0
          for f in "${REQUIRED[@]}"; do
            if [ ! -f "assets/fonts/$f" ]; then
              echo "MISSING: $f"
              MISSING=1
            fi
          done
          if [ "$MISSING" -eq 1 ]; then
            echo "::error::코어 폰트가 저장소 assets/fonts/ 에 없습니다."
            echo "           로컬 풀팩에서 build_core_from_fullpack.{sh,ps1}로 코어 ZIP을"
            echo "           먼저 생성한 뒤 그 내용(5종 + 메타)을 저장소에 커밋하거나,"
            echo "           또는 풀팩 전체(129종)를 assets/fonts/에 커밋하세요."
            exit 1
          fi

      - name: Verify CJK support (fail fast)
        run: |
          python3 -m pip install fontTools --quiet
          python3 scripts/verify_cjk_support.py assets/fonts --strict
          echo "✓ 코어 5종 모두 스킬 철학 한자 9/9 완전 지원 확인"

      - name: Stage core package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          STAGE="stage/canvas-design-kr"
          mkdir -p "$STAGE/assets/fonts" "$STAGE/scripts"

          # 메타 파일 복사
          cp SKILL.md README.md changelog.md LICENSE.txt LICENSE-canvas-design.txt NOTICE.txt "$STAGE/"

          # 스크립트 복사 (전체)
          cp scripts/discover_fonts.py "$STAGE/scripts/"
          cp scripts/verify_cjk_support.py "$STAGE/scripts/"
          cp scripts/install_full_fonts.sh "$STAGE/scripts/"
          cp scripts/install_full_fonts.ps1 "$STAGE/scripts/"
          cp scripts/build_core_from_fullpack.sh "$STAGE/scripts/"
          cp scripts/build_core_from_fullpack.ps1 "$STAGE/scripts/"
          cp scripts/build_full_pack.sh "$STAGE/scripts/"
          cp scripts/build_full_pack.ps1 "$STAGE/scripts/"

          # 코어 폰트 5종 복사 (대괄호 리터럴 유의)
          cp "assets/fonts/NotoSansKR-VF.ttf" "$STAGE/assets/fonts/"
          cp "assets/fonts/NanumMyeongjo-OldHangul.ttf" "$STAGE/assets/fonts/"
          cp "assets/fonts/NanumBrushScript-Regular.ttf" "$STAGE/assets/fonts/"
          cp "assets/fonts/NanumPenScript-Regular.ttf" "$STAGE/assets/fonts/"
          cp "assets/fonts/JejuGothic-Regular.ttf" "$STAGE/assets/fonts/"

          # OFL 라이선스 (있는 것 전부 복사)
          cp assets/fonts/*-OFL.txt "$STAGE/assets/fonts/" 2>/dev/null || true

          # MANIFEST.txt 갱신
          cat > "$STAGE/assets/fonts/MANIFEST.txt" <<EOF
          # canvas-design-kr — Font Manifest
          # 이 파일은 assets/fonts/에 실제로 존재해야 하는 폰트 파일 목록의 표준 참조다.
          #
          # Format: <pack>:<filename>
          #   pack = core | full
          #
          # 마지막 갱신: $(date '+%Y-%m-%d') ($VERSION 코어 패키지)
          # Pack: core (5 files, ~28.5 MB, CJK-complete)

          core:JejuGothic-Regular.ttf
          core:NanumBrushScript-Regular.ttf
          core:NanumMyeongjo-OldHangul.ttf
          core:NanumPenScript-Regular.ttf
          core:NotoSansKR-VF.ttf
          EOF

          ls -la "$STAGE/assets/fonts/"

      - name: Check size
        run: |
          SIZE=$(du -sb stage/canvas-design-kr | cut -f1)
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "비압축 크기: ${SIZE_MB} MB"
          if [ "$SIZE_MB" -gt 30 ]; then
            echo "::warning::비압축 크기 ${SIZE_MB} MB가 Claude Desktop 30 MB 한도 초과!"
          fi

      - name: Create core ZIP
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ZIP_NAME="canvas-design-kr-${VERSION}.zip"
          (cd stage && zip -qr "../${ZIP_NAME}" canvas-design-kr)
          ls -la "${ZIP_NAME}"
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV

      - name: Upload core to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          draft: false
          prerelease: false
          generate_release_notes: true

  build-fullpack:
    name: Build Full Pack ZIP
    runs-on: ubuntu-latest
    needs: build-core
    # 저장소 assets/fonts/에 100종 이상이 있을 때만 자동 빌드
    if: ${{ needs.build-core.outputs.font_count >= 100 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "version=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Stage full pack (exclude core 5)
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p stage-full/fonts

          # v1.1.0 코어 5종 — 풀팩에서 제외
          # 저장소 규칙상 NotoSansKR-VF.ttf를 커밋하지만, 원본 파일명 변형들도 방어적으로 제외
          CORE_NAMES="NotoSansKR-VF.ttf NotoSansKR[wght].ttf NotoSansKR-Variable.ttf NanumMyeongjo-OldHangul.ttf NanumBrushScript-Regular.ttf NanumPenScript-Regular.ttf JejuGothic-Regular.ttf"

          COPIED=0
          while IFS= read -r -d '' f; do
              name=$(basename "$f")
              skip=0
              for c in $CORE_NAMES; do
                  if [ "$name" = "$c" ]; then
                      skip=1
                      break
                  fi
              done
              if [ "$skip" -eq 0 ]; then
                  cp "$f" "stage-full/fonts/$name"
                  COPIED=$((COPIED + 1))
              fi
          done < <(find assets/fonts -maxdepth 1 -type f \( -name "*.ttf" -o -name "*.otf" \) -print0)

          echo "복사된 풀팩 폰트: ${COPIED} 종"

          # OFL 라이선스 파일 전부 복사
          cp assets/fonts/*-OFL.txt stage-full/fonts/ 2>/dev/null || true
          cp assets/fonts/*LICENSE*.txt stage-full/fonts/ 2>/dev/null || true

          ls -la stage-full/fonts/ | head -20

          if [ "$COPIED" -lt 100 ]; then
            echo "::warning::풀팩 폰트가 ${COPIED}종 (100 미만) — 구성 확인 필요"
          fi

      - name: Create Full Pack ZIP
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ZIP_NAME="canvas-design-kr-fonts-full-${VERSION}.zip"
          (cd stage-full && zip -qr "../${ZIP_NAME}" fonts)
          ls -la "${ZIP_NAME}"
          SIZE_MB=$(du -m "${ZIP_NAME}" | cut -f1)
          echo "풀팩 ZIP 크기: ${SIZE_MB} MB"
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV

      - name: Upload Full Pack to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          draft: false
          prerelease: false

  skip-fullpack-notice:
    name: Skip Full Pack (notice)
    runs-on: ubuntu-latest
    needs: build-core
    if: ${{ needs.build-core.outputs.font_count < 100 }}
    steps:
      - name: Notice
        run: |
          echo "::notice::저장소 assets/fonts/ 에 폰트가 ${{ needs.build-core.outputs.font_count }}종만 있습니다."
          echo "           풀팩을 자동 배포하려면 129종 전체를 assets/fonts/에 커밋하거나,"
          echo "           로컬에서 scripts/build_full_pack.{sh,ps1}로 ZIP을 만들어"
          echo "           Release 페이지에 수동 업로드하세요."
